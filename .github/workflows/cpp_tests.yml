name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Отменяем старые запуски при новых пушах в тот же PR, чтобы не тратить ресурсы
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python-logic:
    name: Python Logic Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Фиксируем версию вместо '3.x' для предсказуемости
          cache: 'pip' # Кэшируем зависимости для ускорения следующих запусков
      
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build-cpp-windows:
    name: Build C++ Application (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Find Solution File
        id: find-sln
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path . -Recurse -Filter *.sln | Select-Object -First 1 -ExpandProperty FullName
          if ($sln) {
            echo "sln_path=$sln" >> $env:GITHUB_OUTPUT
            echo "found=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "found=false" >> $env:GITHUB_OUTPUT
          }
      
      - name: Build with MSBuild
        if: steps.find-sln.outputs.found == 'true'
        run: |
          msbuild "${{ steps.find-sln.outputs.sln_path }}" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /t:Rebuild `
            /verbosity:minimal `
            /nologo
      
      - name: Fail if no solution file found
        if: steps.find-sln.outputs.found == 'false'
        shell: pwsh
        run: |
          Write-Error "Не найден .sln файл. Проект на WinAPI требует сборки через MSVC."

  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install Python linters
        run: python -m pip install flake8
      
      - name: Lint Python files
        # Проверяем все Python-файлы, а не только папку tests. 
        # Игнорируем только длину строки (E501), если она мешает, но ловим критические ошибки.
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Install C++ linter (cppcheck)
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      
      - name: Run C++ static analysis
        # Проверяем исходники на утечки, ошибки типов и подозрительные конструкции
        run: |
          cppcheck --enable=warning,performance,portability --inline-suppr \
            --suppress=missingIncludeSystem \
            --project=src/dock_panel.sln 2> cppcheck-report.txt || true
          
          # Выводим отчет, если он не пустой
          if [ -s cppcheck-report.txt ]; then
            echo "::warning::Найдены потенциальные проблемы в C++ коде:"
            cat cppcheck-report.txt
          fi
